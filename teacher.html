<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-size: cover;
            background-position: center;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #34495e;
        }

        h4 {
            font-size: 14px;
            color: #e74c3c;
            font-weight: bold;
        }

        /* Form Container */
        form {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        /* Input and Label Styling */
        label {
            font-size: 16px;
            color: #34495e;
            margin-bottom: 10px;
            display: block;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }

        /* Button Styling */
        input[type="submit"] {
            padding: 12px 20px;
            font-size: 18px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #3498db;
        }

        /* Back Button */
        .btn-back {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #8e44ad;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .btn-back:hover {
            background-color: #9b59b6;
        }
    </style>
</head>
<body>
    <div>
        <h1>FACULTY LOGIN</h1>
        <form action="/authorised" method="POST">
            <h2>
                <label for="password">PASSWORD:</label>
                <input type="text" id="pass" name="password" required>
                <input type="submit" value="Submit">
            </h2>
        </form>
        <p><h4>Password must contain at least 8 characters</h4></p>
        <form action="/" method="GET">
            <button class="btn-back" type="submit">Back to Home Page</button>
        </form>
    </div>
</body>
</html>
